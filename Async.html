<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Team Builder</title>
    <link rel="stylesheet" href="Async.css">
    <script src="Async.js" defer></script>
  </head>
  <body>
    <main class="builder">
      <form id="pokemonForm" class="search-form" autocomplete="off">
        <label for="nameOrId">Name or ID</label>
        <div class="search-row">
          <input type="text" name="nameOrId" id="nameOrId" required placeholder="snorlax">
          <button type="submit">Find</button>
        </div>
      </form>

      <section id="status" class="status" aria-live="polite"></section>

      <section id="pokemonCard" class="pokemon-view hidden" aria-live="polite">
        <h2 id="pokemonName"></h2>
        <img id="pokemonImage" alt="Pokemon image">

        <div class="audio-wrap">
          <label for="pokemonCry">Pokemon Sound</label>
          <audio id="pokemonCry" controls></audio>
        </div>

        <div class="move-grid">
          <select id="move1"></select>
          <select id="move2"></select>
          <select id="move3"></select>
          <select id="move4"></select>
        </div>

        <div class="team-btn-wrap">
          <button id="addToTeamBtn" type="button">Add to Team</button>
        </div>
      </section>

      <section class="team-wrap">
        <ul id="teamList" class="team-list"></ul>
      </section>
    </main>
  </body>
</html>
